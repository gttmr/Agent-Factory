adapters:
  - name: bank_document_ocr_mock_adapter
    adapter_kind: external_service
    owner_domain: 공통
    status: approved
    access_protocol: local
    component_source: stub
    runtime_binding: unresolved
    contract_status: mock_ready
    inputs:
      - name: document_uri
        type: string
        required: true
      - name: document_type_hint
        type: string
        required: false
    outputs:
      - name: ocr_text
        type: text
      - name: page_blocks
        type: array<object>
      - name: confidence
        type: number
      - name: extraction_warnings
        type: array<string>
    risk_signals:
      - personal_data
      - financial_data
      - audit_required
    runtime_mock:
      ocr_text: "[SYNTHETIC] 대출신청서: 신청금액 30,000,000원, 연소득 75,000,000원, 제출서류: 신분증/소득증빙"
      page_blocks:
        - page: 1
          block_id: block-application-summary
          text: 신청금액 30,000,000원 / 연소득 75,000,000원
        - page: 2
          block_id: block-income-proof
          text: 소득금액증명원 연소득 72,000,000원
      confidence: 0.97
      extraction_warnings:
        - synthetic_ocr_output
    notes: local smoke에서 항상 동일한 OCR 결과를 반환하는 synthetic Adapter다.

  - name: banking_policy_search_mock_adapter
    adapter_kind: retrieval
    owner_domain: 공통
    status: approved
    access_protocol: local
    component_source: stub
    runtime_binding: unresolved
    contract_status: mock_ready
    inputs:
      - name: query
        type: text
        required: true
      - name: domain_filter
        type: string
        required: false
    outputs:
      - name: policy_matches
        type: array<object>
      - name: citations
        type: array<object>
      - name: freshness
        type: object
    risk_signals:
      - audit_required
    runtime_mock:
      policy_matches:
        - policy_id: LOAN-DOC-REQ-001
          title: 개인신용대출 필수서류 체크리스트
          matched_rule: income_certificate_required
          excerpt: 재직/소득 증빙은 신청일 기준 30일 이내 발급본을 우선 확인한다.
        - policy_id: LOAN-RISK-DSR-002
          title: DSR soft-limit 검토 기준
          matched_rule: dsr_soft_limit_review
          excerpt: soft-limit 경고는 자동 거절이 아니며 담당자 확인 대상으로 분류한다.
      citations:
        - source: synthetic-policy://loan/documents
          section: 2.1
        - source: synthetic-policy://loan/dsr
          section: 4.3
      freshness:
        effective_date: "2026-01-01"
        synthetic: true
    notes: 정책 검색 결과와 citation shape를 완성한 retrieval mock이다.

  - name: customer_account_snapshot_mock_adapter
    adapter_kind: data_query
    owner_domain: 고객
