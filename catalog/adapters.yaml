    runtime_binding: unresolved
    contract_status: mock_ready
    inputs:
      - name: customer_identifier
        type: string
        required: true
      - name: snapshot_scope
        type: array<string>
        required: false
    outputs:
      - name: customer_snapshot
        type: object
      - name: account_summary
        type: object
      - name: data_freshness
        type: object
    risk_signals:
      - personal_data
      - financial_data
      - audit_required
    runtime_mock:
      customer_snapshot:
        customer_id: CUST-DEMO-001
        display_name: 김데모
        kyc_status: verified
        relationship_years: 7
        masking: synthetic
      account_summary:
        deposit_balance: 18500000
        monthly_income_estimate: 6000000
        delinquency_count_12m: 0
        existing_loan_balance: 42000000
      data_freshness:
        as_of: "2026-05-01T09:00:00+09:00"
        synthetic: true
    notes: 실제 고객정보 없이 local smoke가 완성된 customer/account shape를 받도록 하는 data query mock이다.

  - name: loan_precheck_rule_mock_adapter
    adapter_kind: rule_registry
    owner_domain: 리스크
    status: approved
    access_protocol: local
    component_source: stub
    runtime_binding: unresolved
    contract_status: mock_ready
    inputs:
      - name: rule_set_key
        type: string
        required: true
      - name: case_features
        type: object
        required: true
    outputs:
      - name: rule_result
        type: object
      - name: matched_rules
        type: array<object>
      - name: required_actions
        type: array<string>
    risk_signals:
      - customer_impact
      - credit_decision_support
      - audit_required
    runtime_mock:
      rule_result:
        rule_set_key: loan_precheck_demo_v1
        outcome: review_required
        score_band: B
        hard_stop: false
      matched_rules:
        - rule_id: DSR_SOFT_LIMIT
          result: review_required
          reason: 추정 DSR이 soft threshold 근처입니다.
        - rule_id: DOCUMENT_COMPLETENESS
          result: supplement_required
          reason: 재직증명서가 누락되었습니다.
      required_actions:
        - request_employment_certificate
        - route_to_manual_reviewer
    notes: 자동 승인/거절 대신 검토 필요 상태를 반환하는 rule registry mock이다.

  - name: customer_notice_template_mock_adapter
    adapter_kind: template
    owner_domain: 공통
