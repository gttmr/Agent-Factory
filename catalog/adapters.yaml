        type: string
        required: true
      - name: locale
        type: string
        required: false
      - name: channel
        type: string
        required: false
    outputs:
      - name: template
        type: object
      - name: required_variables
        type: array<string>
      - name: approval_constraints
        type: object
    risk_signals:
      - external_message
      - audit_required
    runtime_mock:
      template:
        template_key: loan_supplement_request_demo
        locale: ko-KR
        channel: internal_preview
        body: "[데모] 대출 사전심사를 위해 {missing_documents} 보완 제출이 필요합니다. 담당자 검토 후 다음 단계를 안내드립니다."
      required_variables:
        - missing_documents
        - reviewer_contact
      approval_constraints:
        external_send_allowed: false
        requires_human_approval: true
        synthetic: true
    notes: 고객 발송이 아니라 내부 preview만 가능한 synthetic template mock이다.

  - name: legacy_loan_limit_change_synthetic_adapter
    adapter_kind: legacy_api
    owner_domain: 여신
    status: approved
    access_protocol: mcp
    mcp_server: legacy-loan-eai-mcp
    mcp_tool_name: submit_loan_limit_change
    mcp_schema_ref: catalog.banking.legacy_loan_limit_change.synthetic.v1
    mcp_auth_mode: synthetic_service_token
    component_source: mcp
    runtime_binding: mcp
    contract_status: mock_ready
    inputs:
      - name: work_item_id
        type: string
        required: true
      - name: customer_ref
        type: string
        required: true
      - name: approval_token
        type: string
        required: true
      - name: correlation_id
        type: string
        required: true
      - name: idempotency_key
        type: string
        required: true
    outputs:
      - name: eai_job_id
        type: string
      - name: callback_expected
        type: boolean
      - name: safe_summary
        type: string
    risk_signals:
      - financial_data
      - customer_impact
      - transaction_write
      - human_approval_required
      - audit_required
    notes: Context Manager와 Callback Broker 검토를 요구하는 synthetic MCP/EAI legacy write 계약이다.

  - name: customer_profile_lookup_synthetic_adapter
    adapter_kind: legacy_api
    owner_domain: 고객
    status: approved
    access_protocol: mcp
    mcp_server: customer-profile-eai-mcp
