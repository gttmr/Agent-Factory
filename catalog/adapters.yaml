        required: true
      - name: page_id
        type: string
        required: true
      - name: additional_required_information
        type: text
        required: false
    outputs:
      - name: analysis_result
        type: object
      - name: recommended_page_id
        type: string
    risk_signals:
      - financial_data
      - audit_required
    runtime_mock:
      synthetic: true
      source: agent-factory-mock-lab
      analysis_result:
        method: user_flow_analysis
        page_id: svc-savings-auto-transfer-setup
        summary: 자동이체 금액 입력 이후 인증 진입 전 단계에서 synthetic 이탈이 높습니다.
        findings:
          - step: amount_input
            signal: hesitation
            synthetic_dropoff_rate: 0.31
          - step: auth_entry
            signal: retry
            synthetic_dropoff_rate: 0.18
      recommended_page_id: svc-savings-auto-transfer-setup
    notes: 선택된 page_id의 synthetic funnel 병목을 반환하는 유저플로우 분석 MCP mock Adapter다.

