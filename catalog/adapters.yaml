    notes: Sync read-only legacy lookup synthetic 계약이다. callback broker와 Context Manager는 기본 필수값이 아니다.

  - name: page_candidate_rag_mock_adapter
    adapter_kind: retrieval
    owner_domain: 디지털채널
    status: approved
    access_protocol: mcp
    mcp_server: page-analysis-mcp
    mcp_tool_name: search_page_candidates
    mcp_schema_ref: catalog.page_analysis.search_page_candidates.v1
    mcp_auth_mode: none
    component_source: mcp
    runtime_binding: mcp
    contract_status: mock_ready
    inputs:
      - name: query
        type: text
        required: true
      - name: scenario_design_purpose
        type: text
        required: true
      - name: scenario_target_business_domain
        type: string
        required: true
      - name: customer_behavior_classification
        type: object
        required: true
    outputs:
      - name: page_candidates
        type: array<object>
      - name: retrieval_metadata
        type: object
    risk_signals:
      - financial_data
      - audit_required
    runtime_mock:
      synthetic: true
      source: agent-factory-mock-lab
      page_candidates:
        - page_id: svc-savings-auto-transfer-setup
          service_id: savings
          page_name: 적금 자동이체 설정
          behavior_path:
            large: 가입/전환
            medium: 자동이체
            small: 설정 이탈
          score: 0.94
          evidence:
            - synthetic-rag-page-catalog:autotransfer
            - behavior-taxonomy:auto-transfer-dropoff
      retrieval_metadata:
        query_id: rag-page-demo-001
        corpus: synthetic-page-catalog-v1
        effective_date: "2026-06-08"
    notes: 고객 행동 유형 분류와 사용자 쿼리를 받아 synthetic page 후보를 반환하는 RAG MCP mock Adapter다.

  - name: user_flow_analysis_mock_adapter
    adapter_kind: computation
