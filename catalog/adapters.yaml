adapters:
  - name: legacy_core_sql_query_adapter
    adapter_kind: data_query
    owner_domain: 공통
    status: proposed
    access_protocol: mcp
    runtime_binding: mcp
    component_source: mcp
    mcp_server: legacy-core-sql-mcp
    mcp_tool_name: execute_readonly_sql
    mcp_schema_ref: catalog.banking.legacy_core_sql.execute_readonly_sql.v1
    mcp_auth_mode: runtime_managed_service_account
    contract_status: runtime_config_required
    inputs:
      - name: data_source_key
        type: string
        required: true
      - name: sql_text
        type: string
        required: true
      - name: parameters
        type: object
        required: false
      - name: query_purpose
        type: string
        required: true
    outputs:
      - name: rows
        type: array<object>
      - name: schema
        type: array<object>
      - name: row_count
        type: number
      - name: query_trace
        type: object
    risk_signals:
      - personal_data
      - financial_data
      - audit_required
    notes: 레거시 코어 DB를 read-only SQL로 조회하는 MCP Adapter 계약. 실제 접속 정보와 권한은 runtime configuration에서 주입하며 catalog에는 credential을 저장하지 않는다.
  - name: bank_document_ocr_adapter
    adapter_kind: external_service
    owner_domain: 공통
    status: proposed
    access_protocol: mcp
    runtime_binding: mcp
    component_source: mcp
    mcp_server: document-ocr-mcp
    mcp_tool_name: extract_bank_document_text
    mcp_schema_ref: catalog.banking.document_ocr.extract_text.v1
    mcp_auth_mode: runtime_managed_service_account
    contract_status: runtime_config_required
    inputs:
      - name: document_uri
        type: string
        required: true
      - name: mime_type
        type: string
        required: false
      - name: document_type_hint
        type: string
        required: false
    outputs:
      - name: ocr_text
        type: text
      - name: page_blocks
        type: array<object>
      - name: confidence
        type: number
      - name: extraction_warnings
        type: array<string>
    risk_signals:
      - personal_data
      - financial_data
      - audit_required
    notes: 신청서, 증빙서류, 약정서 등 은행 문서에서 텍스트와 위치 블록을 추출하는 OCR MCP Adapter 계약.
  - name: banking_policy_retrieval_adapter
    adapter_kind: retrieval
    owner_domain: 공통
    status: proposed
    access_protocol: mcp
    runtime_binding: mcp
    component_source: mcp
    mcp_server: banking-knowledge-mcp
    mcp_tool_name: search_policy_documents
    mcp_schema_ref: catalog.banking.knowledge.policy_search.v1
    mcp_auth_mode: runtime_managed_service_account
    contract_status: runtime_config_required
    inputs:
      - name: query
        type: text
        required: true
      - name: domain_filter
        type: string
        required: false
      - name: effective_date
        type: string
        required: false
    outputs:
      - name: policy_matches
        type: array<object>
      - name: citations
        type: array<object>
      - name: freshness
        type: object
    risk_signals:
      - audit_required
    notes: 여신, 수신, 카드, 고객 업무의 정책/업무 가이드를 근거와 함께 조회하는 retrieval Adapter 계약.
  - name: banking_rule_registry_adapter
    adapter_kind: rule_registry
    owner_domain: 공통
    status: proposed
    access_protocol: mcp
    runtime_binding: mcp
    component_source: mcp
    mcp_server: banking-rule-registry-mcp
    mcp_tool_name: evaluate_rule_set
    mcp_schema_ref: catalog.banking.rule_registry.evaluate_rule_set.v1
    mcp_auth_mode: runtime_managed_service_account
    contract_status: runtime_config_required
    inputs:
      - name: rule_set_key
        type: string
        required: true
      - name: case_features
        type: object
        required: true
      - name: evaluation_date
        type: string
        required: false
    outputs:
      - name: rule_result
        type: object
      - name: matched_rules
        type: array<object>
      - name: required_actions
        type: array<string>
    risk_signals:
      - customer_impact
      - audit_required
    notes: 심사, 라우팅, 승인 필요 여부를 versioned rule set으로 평가하는 rule registry Adapter 계약.
  - name: banking_template_registry_adapter
    adapter_kind: template
    owner_domain: 공통
    status: proposed
    access_protocol: mcp
    runtime_binding: mcp
    component_source: mcp
    mcp_server: banking-template-registry-mcp
    mcp_tool_name: get_template
    mcp_schema_ref: catalog.banking.template_registry.get_template.v1
    mcp_auth_mode: runtime_managed_service_account
    contract_status: runtime_config_required
    inputs:
      - name: template_key
        type: string
        required: true
      - name: locale
        type: string
        required: false
      - name: channel
        type: string
        required: false
    outputs:
      - name: template
        type: object
      - name: required_variables
        type: array<string>
      - name: approval_constraints
        type: object
    risk_signals:
      - external_message
      - audit_required
    notes: 고객 안내문, 보완 요청, 심사 결과 통지 등에 쓰는 승인된 템플릿을 조회하는 Adapter 계약.
  - name: customer_account_snapshot_adapter
    adapter_kind: data_query
    owner_domain: 고객
    status: proposed
    access_protocol: mcp
    runtime_binding: mcp
    component_source: mcp
    mcp_server: customer-account-mcp
    mcp_tool_name: get_customer_account_snapshot
    mcp_schema_ref: catalog.banking.customer_account.snapshot.v1
    mcp_auth_mode: runtime_managed_service_account
    contract_status: runtime_config_required
    inputs:
      - name: customer_identifier
        type: string
        required: true
      - name: snapshot_scope
        type: array<string>
        required: false
    outputs:
      - name: customer_snapshot
        type: object
      - name: account_summary
        type: object
      - name: data_freshness
        type: object
    risk_signals:
      - personal_data
      - financial_data
      - audit_required
    notes: 고객 기본정보와 계좌 요약을 조회하는 MCP Adapter 계약. 조회 범위와 마스킹 정책은 runtime 권한 설정을 따른다.
