workflows:
  - name: 1-1 페이지 추천(필수) Workflow
    workflow_kind: graph
    owner_domain: 공통
    status: approved
    component_source: stub
    runtime_binding: unresolved
    contract_status: mock_ready
    responsibility: 사용자 확인 Gate, Mock Lab adapter fan-out/fan-in, final handoff를 포함하는 Workflow graph owner다.
    inputs:
      - name: objective_text
        type: string
        required: true
    outputs:
      - name: broad_handoff_payload
        type: object
        required: true
    composition:
      - 'adapter: 시나리오 목적 분류체계 조회 Adapter'
      - 'agent: 목적 분류 Agent'
      - 'human_input: 목적/시나리오 분류 확인'
      - 'agent: Adapter Arguments 생성 Agent'
      - 'adapter: Page Metadata RAG 조회 Adapter와 페이지×상품 매핑 조회 Adapter를 병렬 조회'
      - 'agent: 1차 Page 선택 Agent'
      - 'human_input + router: run_analysis 또는 skip_analysis 분기'
      - 'adapter fan-out: UserFlow 분석, 행동유형 기반 시나리오 추천, T2S 분석'
      - 'agent: 분석 결과 종합 Agent'
      - 'human_input: 사용자 최종 Page(다중) 선택'
      - 'workflow_call: Workflow 1-2 전달 Placeholder'
    scaffold_output: orchestration_shell_only
    risk_signals:
      - customer_impact
      - external_message
      - human_approval_required
      - audit_required
    runtime_mock:
      broad_handoff_payload:
        selected_page_ids:
          - NWMMH00040_003M
        source_workflow: req-page-recommendation-required
        synthetic: true
    notes: 등록된 catalog 모듈을 조합해 설계하는 best-scenario 검증용 root workflow 계약이다.
  - name: Workflow 1-2 전달 Placeholder
    workflow_kind: graph
    owner_domain: 공통
    status: approved
    component_source: stub
    runtime_binding: unresolved
    contract_status: mock_ready
    responsibility: Workflow 1-2는 미확정이므로 broad handoff payload를 반환하는 placeholder workflow_call로만 표현한다.
    inputs:
      - name: broad_handoff_payload
        type: object
        required: true
    outputs:
      - name: broad_handoff_payload
        type: object
        required: true
    composition:
      - 'workflow_call placeholder: Workflow 1-2 계약 확정 전 broad_handoff_payload를 synthetic으로 반환한다.'
    scaffold_output: workflow_call_placeholder
    risk_signals:
      - audit_required
    runtime_mock:
      broad_handoff_payload:
        selected_page_ids:
          - NWMMH00040_003M
        target_workflow: wf-1-2-placeholder
        unresolved_contract: true
        synthetic: true
    notes: Workflow 1-2 미확정 상태를 보존하는 synthetic placeholder workflow 계약이다.
