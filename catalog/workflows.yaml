workflows:
  - name: common_document_intake_workflow
    workflow_kind: graph
    owner_domain: 공통
    status: proposed
    runtime_binding: remote_a2a
    component_source: remote_a2a
    contract_status: runtime_config_required
    responsibility: 여러 도메인에서 제출되는 문서를 수신해 OCR, 정책 근거 조회, 문서 context 생성까지 공통으로 수행한다.
    inputs:
      - name: document_package
        type: object
        required: true
      - name: domain_context
        type: object
        required: false
    outputs:
      - name: document_context
        type: object
      - name: intake_artifacts
        type: array<object>
      - name: intake_warnings
        type: array<string>
    composition:
      - "input: document_package에서 문서 URI, 문서 유형, 업무 도메인을 분리한다."
      - "adapter: bank_document_ocr_adapter로 텍스트, page_blocks, extraction_warnings를 추출한다."
      - "adapter: banking_policy_retrieval_adapter로 문서 유형별 필수 항목과 심사 기준을 조회한다."
      - "merge: OCR 결과와 정책 근거를 document_context와 intake_artifacts로 병합한다."
      - "output: 후속 도메인 Workflow가 사용할 표준 document_context를 반환한다."
    scaffold_output: orchestration_shell_only
    notes: 공통 Workflow는 다른 도메인에서 Remote A2A 방식으로 호출될 수 있는 runtime contract로 등록한다.
  - name: loan_application_precheck_workflow
    workflow_kind: graph
    owner_domain: 여신
    status: proposed
    runtime_binding: unresolved
    contract_status: runtime_config_required
    responsibility: 여신 신청 접수 후 문서 intake, 고객/계좌 조회, 정책/룰 평가, 서류 검토, 위험 판단을 묶어 사전 심사 결과를 만든다.
    inputs:
      - name: loan_application
        type: object
        required: true
      - name: submitted_documents
        type: array<object>
        required: true
    outputs:
      - name: precheck_result
        type: object
      - name: approval_required
        type: boolean
      - name: next_actions
        type: array<string>
    composition:
      - "workflow: common_document_intake_workflow로 제출 문서를 표준 document_context로 변환한다."
      - "adapter: legacy_core_sql_query_adapter로 기존 여신, 연체, 심사 이력에 필요한 read-only 데이터를 조회한다."
      - "adapter: customer_account_snapshot_adapter로 고객 및 계좌 요약을 조회한다."
      - "adapter: banking_rule_registry_adapter로 여신 사전 심사 rule_set을 평가한다."
      - "agent: loan_document_review_specialist가 서류 누락과 보완 필요 사항을 판단한다."
      - "agent: credit_risk_reasoning_specialist가 위험 신호와 사람 승인 필요성을 설명한다."
      - "adapter: banking_template_registry_adapter로 보완 요청 또는 심사 안내 템플릿을 조회한다."
    scaffold_output: orchestration_shell_only
    notes: 여신 도메인 내부 Workflow이며 실제 실행 방식은 Python import, local package, 또는 별도 runtime binding 검토 후 확정한다.
