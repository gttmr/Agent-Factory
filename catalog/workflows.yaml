workflows:
  - name: common_document_intake_mock_workflow
    workflow_kind: graph
    owner_domain: 공통
    status: approved
    component_source: stub
    runtime_binding: unresolved
    contract_status: mock_ready
    responsibility: 제출 문서를 OCR하고 정책 근거를 붙여 후속 업무가 사용할 표준 document_context를 만든다.
    inputs:
      - name: document_package
        type: object
        required: true
      - name: domain_context
        type: object
        required: false
    outputs:
      - name: document_context
        type: object
      - name: intake_artifacts
        type: array<object>
      - name: intake_warnings
        type: array<string>
    composition:
      - "adapter: bank_document_ocr_mock_adapter가 synthetic OCR 결과를 반환한다."
      - "adapter: banking_policy_search_mock_adapter가 문서 체크리스트 정책 근거를 반환한다."
      - "merge: OCR와 policy_matches를 document_context로 병합한다."
    scaffold_output: orchestration_shell_only
    runtime_mock:
      document_context:
        document_package_id: DOC-PKG-DEMO-001
        normalized_document_type: loan_application_pack
        extracted_fields:
          requested_amount: 30000000
          stated_annual_income: 75000000
          proof_annual_income: 72000000
        policy_basis:
          - LOAN-DOC-REQ-001
          - LOAN-RISK-DSR-002
      intake_artifacts:
        - artifact_id: art-ocr-demo-001
          kind: ocr_text
        - artifact_id: art-policy-demo-001
          kind: policy_citation_pack
      intake_warnings:
        - synthetic_document_context
    notes: 다른 도메인이 재사용할 수 있는 local graph workflow mock이다. Remote A2A로 승격하지 않는다.

  - name: loan_application_precheck_mock_workflow
    workflow_kind: graph
    owner_domain: 여신
    status: approved
    component_source: stub
    runtime_binding: unresolved
    contract_status: mock_ready
    responsibility: 대출 신청을 문서 intake, 고객 snapshot, rule 평가, 문서 검토, 위험 설명, 안내 템플릿 조회 순서로 묶어 local smoke 가능한 사전심사 결과를 만든다.
    inputs:
      - name: loan_application
        type: object
        required: true
      - name: submitted_documents
        type: array<object>
        required: true
    outputs:
      - name: precheck_result
        type: object
      - name: approval_required
        type: boolean
      - name: next_actions
        type: array<string>
    composition:
      - "workflow: common_document_intake_mock_workflow로 document_context를 만든다."
      - "adapter: customer_account_snapshot_mock_adapter로 synthetic customer/account snapshot을 조회한다."
      - "adapter: loan_precheck_rule_mock_adapter로 사전심사 rule을 평가한다."
      - "agent: loan_document_review_mock_agent가 서류 누락과 불일치를 설명한다."
      - "agent: credit_risk_reasoning_mock_agent가 위험 근거와 담당자 승인 필요성을 설명한다."
      - "adapter: customer_notice_template_mock_adapter로 내부 preview 템플릿을 가져온다."
    scaffold_output: orchestration_shell_only
    runtime_mock:
      precheck_result:
        case_id: LOAN-DEMO-CASE-001
        outcome: supplement_required_manual_review
        customer_id: CUST-DEMO-001
        requested_amount: 30000000
        summary: 재직증명서 보완 및 담당자 검토가 필요한 synthetic 사전심사 결과입니다.
        evidence_refs:
          - LOAN-DOC-REQ-001
          - DSR_SOFT_LIMIT
      approval_required: true
      next_actions:
        - request_employment_certificate
        - reconcile_income_mismatch
        - route_to_manual_reviewer
        - preview_customer_notice_only
    notes: 사용자가 여신 사전심사 유즈케이스를 넣었을 때 전체 catalog 조합과 ADK stub run을 검증하기 위한 대표 workflow mock이다.
