agents:
  - name: loan_document_review_specialist
    agent_kind: specialist
    owner_domain: 여신
    status: proposed
    runtime_binding: unresolved
    contract_status: runtime_config_required
    responsibility: 여신 신청서와 증빙 OCR 결과를 검토해 필수 서류 누락, 불일치, 보완 요청 필요 여부를 판단한다.
    inputs:
      - name: document_context
        type: object
        required: true
      - name: policy_matches
        type: array<object>
        required: false
      - name: customer_snapshot
        type: object
        required: false
    outputs:
      - name: document_review_result
        type: object
      - name: missing_documents
        type: array<string>
      - name: followup_questions
        type: array<string>
    scaffold_output: agent_shell_only
    notes: 여신 담당자가 검토할 서류 근거와 보완 필요 사항을 정리하는 Agent 계약.
  - name: credit_risk_reasoning_specialist
    agent_kind: specialist
    owner_domain: 리스크
    status: proposed
    runtime_binding: unresolved
    contract_status: runtime_config_required
    responsibility: 조회된 고객/계좌/여신 정보와 rule result를 근거로 위험 신호, 사람 승인 필요성, 추가 확인 필요성을 설명한다.
    inputs:
      - name: applicant_context
        type: object
        required: true
      - name: rule_result
        type: object
        required: true
      - name: evidence_pack
        type: object
        required: false
    outputs:
      - name: risk_reasoning
        type: object
      - name: approval_required
        type: boolean
      - name: reviewer_notes
        type: array<string>
    scaffold_output: agent_shell_only
    notes: 자동 승인/거절 결정이 아니라 심사자 검토를 위한 위험 근거를 정리하는 Agent 계약.
