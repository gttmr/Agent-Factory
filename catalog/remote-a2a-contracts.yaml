remote_a2a_contracts:
  - name: remote_legal_review_agent_contract
    owner_domain: 공통
    status: placeholder
    inputs:
      - name: review_packet
        type: object
        required: true
      - name: jurisdiction_hint
        type: string
        required: false
    outputs:
      - name: legal_review_result
        type: object
      - name: required_disclaimer
        type: string|null
    required_before_approval:
      - remote_owner
      - agent_card_or_discovery
      - request_schema
      - response_schema
      - task_lifecycle
      - auth
      - timeout
      - retry
      - fallback
      - audit
      - data_policy
    notes: 독립 운영되는 법무 검토 Agent가 실제로 있을 때만 Remote A2A 후보로 승격한다.
  - name: remote_identity_review_agent_contract
    owner_domain: 고객
    status: placeholder
    inputs:
      - name: identity_review_request
        type: object
        required: true
      - name: evidence_refs
        type: array<object>
        required: false
    outputs:
      - name: identity_review_result
        type: object
      - name: reviewer_notes
        type: array<string>
    required_before_approval:
      - remote_owner
      - agent_card_or_discovery
      - request_schema
      - response_schema
      - task_lifecycle
      - auth
      - timeout
      - retry
      - fallback
      - audit
      - data_policy
    notes: 외부 신원 검토 조직이 별도 Agent endpoint를 제공한다는 증거가 있어야 한다.
  - name: remote_domain_expert_agent_contract
    owner_domain: 공통
    status: placeholder
    inputs:
      - name: delegated_question
        type: object
        required: true
      - name: context_refs
        type: array<object>
        required: false
    outputs:
      - name: expert_answer
        type: object
      - name: confidence
        type: number
    required_before_approval:
      - remote_owner
      - agent_card_or_discovery
      - request_schema
      - response_schema
      - task_lifecycle
      - auth
      - timeout
      - retry
      - fallback
      - audit
      - data_policy
    notes: 사내 공통 전문가 Agent나 외부 전문기관 Agent 연계를 검토할 때 쓰는 placeholder 계약.
