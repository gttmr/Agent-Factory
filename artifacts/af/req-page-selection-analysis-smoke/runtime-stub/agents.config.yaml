# agents.config.yaml — per-node overrides for the runnable ADK bundle.
# Edit model / instruction / mcp_url here. agent.py loads this at import and
# applies the overrides, so editing this file actually changes behavior.
# Shared secrets live in <repo>/.agent-factory/runtime.env, not in this bundle.
default_model: gemini-2.5-flash
agents:
  - id: mod-behavior-classifier
    name: mod_behavior_classifier
    model: gemini-2.5-flash
    instruction: |
      You are "customer_behavior_type_classifier_agent".
      Responsibility: The classification requires interpreting user intent and mapping it to known 대/중/소 behavior categories, which is an Agent reasoning responsibility.
      Inputs you receive: scenario_design_purpose, scenario_target_business_domain.
      Outputs you must produce: customer_behavior_classification.
      Operate only on the synthetic inputs provided in session state. Never invent private data, real endpoints, or credentials.
      Example user message: 자동이체 설정 전환율 개선 시나리오의 고객 행동 유형을 분류해줘.
  - id: mod-page-decision-agent
    name: mod_page_decision_agent
    model: gemini-2.5-flash
    instruction: |
      You are "page_selection_decision_agent".
      Responsibility: The model must judge which page candidate best matches the user's intent and decide whether optional analysis is required.
      Inputs you receive: page_candidates, chat_query, customer_behavior_classification.
      Outputs you must produce: selected_page_id, additional_analysis_required, selected_analysis_method, additional_info_request.
      Operate only on the synthetic inputs provided in session state. Never invent private data, real endpoints, or credentials.
      Example user message: 후보 중 자동이체 설정 이탈 분석에 가장 맞는 페이지를 선택하고 추가 분석 여부를 판단해줘.
  - id: mod-workflow2-handoff-agent
    name: mod_workflow2_handoff_agent
    model: gemini-2.5-flash
    instruction: |
      You are "workflow2_page_handoff_agent".
      Responsibility: The final step must reconcile the initial page choice and optional analysis result into the page id passed to workflow2.
      Inputs you receive: selected_page_id, analysis_result, customer_behavior_classification.
      Outputs you must produce: workflow2_handoff, selected_page_id.
      Operate only on the synthetic inputs provided in session state. Never invent private data, real endpoints, or credentials.
      Example user message: 선택 page_id와 분석 결과를 workflow2 입력으로 만들어줘.
adapters:
  - id: mod-page-rag-retrieval
    connection: mcp_connected
    mcp_server: page-analysis-mcp
    mcp_tool: search_page_candidates
    mcp_url: null  # default: $AF_MOCK_LAB_MCP_URL/<mcp_server>
    input_map: {}  # optional: {tool_input_name: state_or_upstream_output_key}
  - id: mod-user-flow-analysis
    connection: mcp_connected
    mcp_server: page-analysis-mcp
    mcp_tool: analyze_user_flow
    mcp_url: null  # default: $AF_MOCK_LAB_MCP_URL/<mcp_server>
    input_map: {}  # optional: {tool_input_name: state_or_upstream_output_key}
  - id: mod-behavior-scenario-analysis
    connection: mcp_connected
    mcp_server: page-analysis-mcp
    mcp_tool: recommend_behavior_scenarios
    mcp_url: null  # default: $AF_MOCK_LAB_MCP_URL/<mcp_server>
    input_map: {}  # optional: {tool_input_name: state_or_upstream_output_key}
  - id: mod-t2s-page-customer-analysis
    connection: mcp_connected
    mcp_server: page-analysis-mcp
    mcp_tool: execute_page_customer_sql
    mcp_url: null  # default: $AF_MOCK_LAB_MCP_URL/<mcp_server>
    input_map: {}  # optional: {tool_input_name: state_or_upstream_output_key}
workflows:
  - id: mod-page-selection-workflow
    note: deterministic coordinator placeholder; expand into a sub-graph in a follow-up.
