# agents.config.yaml — per-node overrides for the runnable ADK bundle.
# Edit model / instruction / mcp_url here. agent.py loads this at import and
# applies the overrides, so editing this file actually changes behavior.
# Shared secrets live in <repo>/.agent-factory/runtime.env, not in this bundle.
default_model: gemini-2.5-flash
agents:
  - id: mod-loan-document-review
    name: mod_loan_document_review
    model: gemini-2.5-flash
    instruction: |
      You are "loan_document_review_mock_agent".
      Responsibility: OCR와 정책 조회 결과를 바탕으로 대출 신청 서류의 누락, 불일치, 보완 필요 사항을 synthetic rule로 정리한다.
      Inputs you receive: document_context, policy_matches.
      Outputs you must produce: document_review_result, missing_documents, followup_questions.
      Operate only on the synthetic inputs provided in session state. Never invent private data, real endpoints, or credentials.
      Example user message: 문서 누락과 불일치를 synthetic evidence 기반으로 설명한다.
  - id: mod-credit-risk-reasoning
    name: mod_credit_risk_reasoning
    model: gemini-2.5-flash
    instruction: |
      You are "credit_risk_reasoning_mock_agent".
      Responsibility: 고객 snapshot, rule result, 문서 검토 결과를 모아 사람이 확인할 위험 근거와 다음 조치를 설명한다.
      Inputs you receive: customer_snapshot, rule_result, document_review_result.
      Outputs you must produce: risk_reasoning, approval_required, reviewer_notes.
      Operate only on the synthetic inputs provided in session state. Never invent private data, real endpoints, or credentials.
      Example user message: 담당자가 확인할 위험 근거와 다음 조치를 설명한다.
adapters:
  - id: mod-customer-account-snapshot
    connection: unconnected
    mcp_server: null
    mcp_tool: null
    mcp_url: null  # default: $AF_MOCK_LAB_MCP_URL/<mcp_server>
  - id: mod-loan-precheck-rule
    connection: unconnected
    mcp_server: null
    mcp_tool: null
    mcp_url: null  # default: $AF_MOCK_LAB_MCP_URL/<mcp_server>
  - id: mod-customer-notice-template
    connection: unconnected
    mcp_server: null
    mcp_tool: null
    mcp_url: null  # default: $AF_MOCK_LAB_MCP_URL/<mcp_server>
workflows:
  - id: mod-loan-precheck-workflow
    note: deterministic coordinator placeholder; expand into a sub-graph in a follow-up.
  - id: mod-common-document-intake
    note: deterministic coordinator placeholder; expand into a sub-graph in a follow-up.
